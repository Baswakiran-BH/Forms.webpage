{% extends 'base.html' %}
{% block title %}Upload File{% endblock %}

{% block content %}
  <a href="{{ url_for('forms_home') }}" class="back-link">&larr; Back to Forms</a>
  <h2>Upload a File</h2>

  <form action="{{ url_for('submit_upload') }}" method="POST" enctype="multipart/form-data">
    <div>
      <label for="file">Choose file</label>
      <input type="file" id="file" name="file" required>
      <p class="muted">Allowed: png, jpg, jpeg, pdf, txt (max 5 MB)</p>
    </div>
    <div>
      <label for="note">Note (optional)</label>
      <textarea id="note" name="note" rows="3" placeholder="Describe this upload (optional)"></textarea>
    </div>
    <div>
      <input type="submit" value="Upload">
    </div>
  </form>
{% endblock %}
