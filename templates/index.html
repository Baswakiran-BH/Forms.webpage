{% extends 'base.html' %}
{% block title %}Home{% endblock %}

{% block content %}
  <h2>Welcome{% if username %}, {{ username }}{% endif %}!</h2>

  {% if username %}
    <p>
      <a href="{{ url_for('forms_home') }}" class="btn">Open Forms</a>
      &nbsp; <a href="{{ url_for('logout') }}" class="btn btn--ghost">Logout</a>
    </p>
  {% else %}
    <p><a href="{{ url_for('login_page') }}" class="btn">Login to access forms</a></p>
  {% endif %}
{% endblock %}
